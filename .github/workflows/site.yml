name: Verify and build homepage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.hosting.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/update_release.py --check
      - run: python tools/update_screenshots.py --check
      - run: python tools/build_site.py
      - run: node --check dist/site.*.js
      - name: Check existing hosting configuration
        id: hosting
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/pages.json" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200) jq -r '"publish=" + ((.build_type == "workflow") | tostring)' "$RUNNER_TEMP/pages.json" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Pages status lookup failed (HTTP $status)" >&2; exit 1 ;;
          esac
      - name: Verify public support destinations
        if: steps.hosting.outputs.publish == 'true'
        run: python tools/check_public_links.py
      - uses: actions/upload-pages-artifact@v4
        if: steps.hosting.outputs.publish == 'true'
        with:
          path: dist
    permissions:
      contents: read
      pages: read

  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
